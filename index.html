<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학원 출석 체크</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#232B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="출석체크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAEEF4;
    --card: #FFFFFF;
    --ink: #232B3D;
    --ink-soft: #6B7488;
    --line: #D8DEE9;
    --active-tint: #F4F7FB;
    --present: #3E8E6E;
    --present-bg: #E4F3EC;
    --absent: #C1666B;
    --absent-bg: #FAEBEC;
    --none-bg: #EEF0F4;
    --none-line: #C7CEDB;
    --accent: #D98F3B;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:1120px; margin:0 auto; padding:28px 20px 60px; }
  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:20px; flex-wrap:wrap; gap:8px;
  }
  header.top h1{
    font-family:'Gowun Dodum', sans-serif; font-weight:400;
    font-size:26px; margin:0; letter-spacing:-0.2px;
  }
  header.top .sub{ color:var(--ink-soft); font-size:13px; }

  .sync-bar{ margin-bottom:18px; }
  .sync-note{ font-size:12.5px; color:var(--ink-soft); }
  .sync-note b{ color:var(--ink); letter-spacing:0.5px; }
  .sync-change-btn{
    background:none; border:none; color:var(--accent); font-size:12px;
    font-weight:600; cursor:pointer; margin-left:6px; padding:0;
  }
  .sync-setup{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .sync-setup-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .sync-setup-row input{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:inherit; background:var(--paper); flex:1; min-width:120px;
  }

  .card{ background:var(--card); border-radius:var(--radius); border:1px solid var(--line); }

  /* summary */
  .summary-card{ padding:16px 18px; margin-bottom:18px; }
  .summary-card h2{ font-size:13px; font-weight:600; margin:0 0 12px; color:var(--ink-soft); }
  .summary-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:10px;
  }
  .summary-item{
    border:1px solid var(--line); border-radius:11px; padding:10px 12px;
    display:flex; flex-direction:column; gap:4px;
  }
  .summary-item .who{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  }
  .summary-item .avatar-sm{
    width:18px; height:18px; border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px; color:#fff; font-weight:700;
  }
  .summary-item .academy-name{ font-size:13.5px; font-weight:700; }
  .summary-item .days-row{ font-size:11px; color:var(--ink-soft); }
  .summary-item .stat-row{
    display:flex; gap:10px; font-size:12px; margin-top:2px;
  }
  .summary-item .stat-row b{ font-weight:700; }
  .summary-item .cycle-row{
    font-size:11.5px; color:var(--accent); font-weight:600; margin-top:4px;
    padding-top:4px; border-top:1px dashed var(--line);
  }
  .summary-item .cycle-paid-row{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .summary-item .summary-note{ font-size:11px; color:var(--accent); margin-top:5px; font-weight:600; }
  .stat-present b{ color:var(--present); }
  .stat-scheduled b{ color:var(--ink); }
  .summary-empty{ font-size:13px; color:var(--ink-soft); padding:6px 0; }

  .layout{ display:flex; gap:20px; align-items:flex-start; }
  .sidebar{ width:270px; flex-shrink:0; }

  .kids-card{ padding:16px; }
  .kids-card h2{ font-size:13px; font-weight:600; margin:0 0 12px; color:var(--ink-soft); }
  .kid-block{ border-bottom:1px solid var(--line); padding:10px 0; }
  .kid-block:last-of-type{ border-bottom:none; }
  .kid-head{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:30px; height:30px; border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:600; color:#fff; flex-shrink:0;
  }
  .kid-name{ font-size:14px; font-weight:600; flex:1; }
  .kid-del{
    background:none; border:none; color:var(--ink-soft);
    cursor:pointer; font-size:15px; padding:4px; line-height:1; border-radius:6px;
  }
  .kid-del:hover{ background:var(--none-bg); color:var(--absent); }

  .academy-list{ margin:8px 0 4px; display:flex; flex-direction:column; gap:6px; }
  .academy-tag{
    background:var(--none-bg); border-radius:9px; padding:6px 9px; font-size:12px;
  }
  .academy-tag-main{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .academy-tag .a-name{ font-weight:600; }
  .academy-tag .a-days{ color:var(--ink-soft); font-size:11px; margin-left:4px; }
  .academy-tag .a-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .academy-tag .a-edit{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:12px; padding:2px; }
  .academy-tag .a-edit:hover{ color:var(--accent); }
  .academy-tag .a-del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; }
  .academy-tag .a-del:hover{ color:var(--absent); }
  .academy-tag .a-note{ font-size:11px; color:var(--accent); margin-top:4px; font-weight:600; }

  .mini-add-btn{
    font-size:12px; color:var(--accent); background:none; border:none;
    cursor:pointer; padding:2px 0; font-weight:600;
  }
  .academy-form{ display:none; flex-direction:column; gap:6px; margin-top:6px; }
  .academy-form.open{ display:flex; }
  .academy-form input{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:12.5px; font-family:inherit; background:var(--paper);
  }
  .day-toggle-row{ display:flex; gap:4px; flex-wrap:wrap; }
  .cycle-input-row{ display:flex; flex-direction:column; gap:6px; }
  .cycle-input-row input{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:12px; font-family:inherit; background:var(--paper);
  }
  .day-toggle{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:var(--paper); font-size:11px; cursor:pointer; color:var(--ink-soft);
  }
  .day-toggle.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .form-row{ display:flex; gap:6px; margin-top:2px; }
  .btn{ border:none; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#3a4358; }
  .btn-muted{ background:var(--none-bg); color:var(--ink-soft); }
  .form-row .btn{ flex:1; }

  .add-kid-form{ display:none; flex-direction:column; gap:8px; margin-top:12px; }
  .add-kid-form.open{ display:flex; }
  .add-kid-form input{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:inherit; background:var(--paper);
  }
  .btn-ghost{
    background:none; border:1px dashed var(--none-line); color:var(--ink-soft);
    width:100%; margin-top:10px; padding:9px; border-radius:10px; font-size:13px; font-weight:500;
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }

  /* calendar */
  .calendar-card{ flex:1; padding:18px 18px 22px; min-width:0; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-nav .month-label{ font-family:'Gowun Dodum', sans-serif; font-size:19px; }
  .nav-btn{
    background:var(--none-bg); border:none; width:30px; height:30px; border-radius:50%;
    cursor:pointer; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .nav-btn:hover{ background:var(--line); }
  .kid-legend{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:10px; }
  .kid-legend .item{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .kid-legend .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .calendar-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .calendar-inner{ width:max-content; min-width:100%; }
  .weekdays{ display:grid; grid-template-columns:repeat(7,minmax(132px,1fr)); gap:6px; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .weekdays div{ text-align:center; padding:4px 0; }
  .weekdays div.sat{ color:#4C6FBE; font-weight:700; }
  .weekdays div.sun{ color:var(--absent); font-weight:700; }
  .grid{ display:grid; grid-template-columns:repeat(7,minmax(132px,1fr)); gap:6px; }
  .cell{ min-height:78px; min-width:0; border-radius:10px; padding:7px 7px 9px; background:transparent; }
  .cell.empty{ background:none; }
  .cell .date-num{ font-size:13px; color:var(--ink-soft); margin-bottom:4px; }
  .cell.has-class{ background:var(--active-tint); border:1px solid var(--line); }
  .cell.holiday{ background:var(--absent-bg); border:1px solid #F0C7CB; }
  .cell.holiday .date-num{ color:var(--absent); font-weight:700; }
  .cell .holiday-name{ font-size:9.5px; color:var(--absent); margin:-2px 0 4px; line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip-list{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .chip{
    display:flex; align-items:center; gap:5px; font-size:13px; padding:5px 9px;
    border-radius:20px; cursor:pointer; border:1px solid var(--none-line);
    background:var(--none-bg); color:var(--ink-soft); user-select:none;
    transition:transform .08s ease; min-width:0; width:100%;
  }
  .chip:active{ transform:scale(0.96); }
  .chip.present{ background:var(--present-bg); border-color:#BFE3D1; color:var(--present); }
  .chip.absent{ background:var(--absent-bg); border-color:#EFC9CC; color:var(--absent); }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .chip .txt{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip-cycle-label{
    font-size:9.5px; color:var(--accent); font-weight:600; margin:-2px 0 2px 3px;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .legend{ display:flex; gap:14px; margin-top:16px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend .dot{ width:8px; height:8px; border-radius:50%; }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    .sidebar{ width:100%; }
    .calendar-card{ padding:14px 10px; }
    .summary-grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>학원 출석 체크</h1>
    <div class="sub">아이와 학원을 등록하고, 달력에서 출석을 기록하세요</div>
  </header>
  <div id="syncBar" class="sync-bar"></div>

  <div class="card summary-card">
    <h2 id="summaryTitle">이번 달 학원별 현황</h2>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="card kids-card">
        <h2>아이와 학원</h2>
        <div id="kidList"></div>
        <button class="btn-ghost" id="showAddKidBtn">+ 아이 추가</button>
        <div class="add-kid-form" id="addKidForm">
          <input type="text" id="nameInput" placeholder="아이 이름">
          <div class="form-row">
            <button class="btn btn-primary" id="saveKidBtn">저장</button>
            <button class="btn btn-muted" id="cancelKidBtn">취소</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card calendar-card">
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" id="nextBtn">›</button>
      </div>
      <div id="kidLegend" class="kid-legend"></div>
      <div class="calendar-scroll">
        <div class="calendar-inner">
          <div class="weekdays">
            <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div><div class="sun">일</div>
          </div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--none-line)"></span>미기록</span>
        <span><span class="dot" style="background:var(--present)"></span>출석</span>
        <span><span class="dot" style="background:var(--absent)"></span>결석</span>
        <span><span class="dot" style="background:var(--absent-bg); border:1px solid #F0C7CB;"></span>일요일·공휴일</span>
      </div>
    </div>
  </div>
</div>

<script>
const AVATAR_COLORS = ['#3E8E6E','#D98F3B','#4C6FBE','#B15C9E','#C1666B','#2F9E9E','#8C6FBE'];
const DAY_LABELS = ['일','월','화','수','목','금','토']; // index = Date.getDay()
const FORM_DAY_ORDER = [1,2,3,4,5,6,0]; // 월화수목금토일 for toggle UI

// 대한민국 법정 공휴일 (2025~2027). 이 범위를 벗어난 연도는 일요일만 빨간색으로 표시돼요.
const KR_HOLIDAYS = {
  // 2025
  '2025-01-01':'신정', '2025-01-27':'임시공휴일', '2025-01-28':'설날 연휴', '2025-01-29':'설날', '2025-01-30':'설날 연휴',
  '2025-03-01':'삼일절', '2025-03-03':'대체공휴일', '2025-05-05':'어린이날·부처님오신날', '2025-05-06':'대체공휴일',
  '2025-06-06':'현충일', '2025-08-15':'광복절', '2025-10-03':'개천절', '2025-10-05':'추석 연휴', '2025-10-06':'추석',
  '2025-10-07':'추석 연휴', '2025-10-08':'대체공휴일', '2025-10-09':'한글날', '2025-12-25':'크리스마스',
  // 2026
  '2026-01-01':'신정', '2026-02-16':'설날 연휴', '2026-02-17':'설날', '2026-02-18':'설날 연휴',
  '2026-03-01':'삼일절', '2026-03-02':'대체공휴일', '2026-05-01':'노동절', '2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날', '2026-05-25':'대체공휴일', '2026-06-03':'지방선거일', '2026-06-06':'현충일',
  '2026-07-17':'제헌절', '2026-08-15':'광복절', '2026-08-17':'대체공휴일', '2026-09-24':'추석 연휴',
  '2026-09-25':'추석', '2026-09-26':'추석 연휴', '2026-10-03':'개천절', '2026-10-05':'대체공휴일',
  '2026-10-09':'한글날', '2026-12-25':'크리스마스',
  // 2027
  '2027-01-01':'신정', '2027-02-06':'설날 연휴', '2027-02-07':'설날', '2027-02-08':'설날 연휴', '2027-02-09':'대체공휴일',
  '2027-03-01':'삼일절', '2027-05-01':'노동절', '2027-05-03':'대체공휴일', '2027-05-05':'어린이날',
  '2027-05-13':'부처님오신날', '2027-06-06':'현충일', '2027-07-17':'제헌절', '2027-07-19':'대체공휴일',
  '2027-08-15':'광복절', '2027-08-16':'대체공휴일', '2027-09-14':'추석 연휴', '2027-09-15':'추석',
  '2027-09-16':'추석 연휴', '2027-10-03':'개천절', '2027-10-04':'대체공휴일', '2027-10-09':'한글날',
  '2027-10-11':'대체공휴일', '2027-12-25':'크리스마스', '2027-12-27':'대체공휴일',
};

let kids = []; // {id, name, color, academies:[{id, name, days:[0-6], cycleSize?, paidCycles?, priorCount?, note?}]}
let attendance = {}; // key: kidId__academyId__YYYY-MM-DD -> 'present' | 'absent'
let current = new Date();
current.setDate(1);
let academyFormState = null; // { kidId, academyId } | null. academyId null => add mode, set => edit mode

const STORAGE_KEYS = { kids: 'academy_attendance_kids', attendance: 'academy_attendance_records', syncCode: 'academy_attendance_sync_code' };

// ===== 클라우드 동기화 (Firebase Firestore) =====
// 아래 firebaseConfig 값을 Firebase 콘솔에서 발급받은 값으로 바꿔 넣으면
// 여러 기기가 같은 "동기화 코드"로 같은 데이터를 공유할 수 있어요.
// 값을 채우지 않으면 이 브라우저에만 저장되는 기존 방식으로 자동으로 동작해요.
const firebaseConfig = {
  apiKey: "AIzaSyBaj_zGeobTxJKIikFZYqpOIOUJiKlpJwc",
  authDomain: "ji-young-attendance.firebaseapp.com",
  projectId: "ji-young-attendance",
  storageBucket: "ji-young-attendance.firebasestorage.app",
  messagingSenderId: "490801802145",
  appId: "1:490801802145:web:891065f4b6310c34c4f9e0"
};

let useCloud = false;
let db = null;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY' && typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    useCloud = true;
  }
}catch(e){ console.error('Firebase 초기화 실패', e); useCloud = false; }

function getSyncCode(){ return localStorage.getItem(STORAGE_KEYS.syncCode); }
function setSyncCode(code){ localStorage.setItem(STORAGE_KEYS.syncCode, code); }
function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 0/O, 1/I 제외
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function renderSyncBar(){
  const el = document.getElementById('syncBar');
  if(!useCloud){
    el.innerHTML = `<div class="sync-note">클라우드 동기화가 설정되지 않았어요. 이 브라우저에만 저장돼요.</div>`;
    return;
  }
  const code = getSyncCode();
  if(code){
    el.innerHTML = `
      <div class="sync-note">
        동기화 코드: <b>${escapeHtml(code)}</b> · 다른 기기에서 이 코드를 입력하면 같은 데이터를 볼 수 있어요
        <button class="sync-change-btn" id="syncChangeBtn">코드 변경</button>
      </div>`;
    document.getElementById('syncChangeBtn').addEventListener('click', ()=>{
      if(confirm('코드를 바꾸면 이 화면에는 새 코드의 데이터(비어있을 수 있음)가 표시돼요. 계속할까요?')){
        localStorage.removeItem(STORAGE_KEYS.syncCode);
        location.reload();
      }
    });
  } else {
    el.innerHTML = `
      <div class="sync-setup">
        <div class="sync-note">여러 기기에서 같은 데이터를 보려면 동기화 코드를 만들거나, 다른 기기에서 만든 코드를 입력하세요.</div>
        <div class="sync-setup-row">
          <button class="btn btn-primary" id="newCodeBtn">새 코드 만들기</button>
          <input type="text" id="joinCodeInput" placeholder="다른 기기의 코드 입력">
          <button class="btn btn-muted" id="joinCodeBtn">연결하기</button>
        </div>
      </div>`;
    document.getElementById('newCodeBtn').addEventListener('click', ()=>{
      setSyncCode(generateCode());
      location.reload();
    });
    document.getElementById('joinCodeBtn').addEventListener('click', ()=>{
      const val = document.getElementById('joinCodeInput').value.trim().toUpperCase();
      if(!val) return;
      setSyncCode(val);
      location.reload();
    });
  }
}

function loadLocal(){
  try{ const k = localStorage.getItem(STORAGE_KEYS.kids); kids = k ? JSON.parse(k) : []; }
  catch(e){ kids = []; }
  try{ const a = localStorage.getItem(STORAGE_KEYS.attendance); attendance = a ? JSON.parse(a) : {}; }
  catch(e){ attendance = {}; }
}

async function saveKids(){
  if(useCloud && getSyncCode()){
    try{ await db.collection('households').doc(getSyncCode()).set({ kids: JSON.stringify(kids) }, { merge:true }); }
    catch(e){ console.error('클라우드 저장 실패', e); }
  } else {
    try{ localStorage.setItem(STORAGE_KEYS.kids, JSON.stringify(kids)); }catch(e){ console.error('저장 실패', e); }
  }
}
async function saveAttendance(){
  if(useCloud && getSyncCode()){
    try{ await db.collection('households').doc(getSyncCode()).set({ attendance: JSON.stringify(attendance) }, { merge:true }); }
    catch(e){ console.error('클라우드 저장 실패', e); }
  } else {
    try{ localStorage.setItem(STORAGE_KEYS.attendance, JSON.stringify(attendance)); }catch(e){ console.error('저장 실패', e); }
  }
}

function init(){
  renderSyncBar();
  const code = getSyncCode();
  if(useCloud && code){
    db.collection('households').doc(code).onSnapshot(doc=>{
      const data = doc.exists ? doc.data() : {};
      try{ kids = data.kids ? JSON.parse(data.kids) : []; }catch(e){ kids = []; }
      try{ attendance = data.attendance ? JSON.parse(data.attendance) : {}; }catch(e){ attendance = {}; }
      render();
    }, err=>{
      console.error('동기화 실패', err);
      loadLocal();
      render();
    });
  } else {
    loadLocal();
    render();
  }
}

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysLabel(days){
  return FORM_DAY_ORDER.filter(d=>days.includes(d)).map(d=>DAY_LABELS[d]).join('·');
}

function countScheduledInMonth(days, year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let day=1; day<=daysInMonth; day++){
    const dow = new Date(year, month, day).getDay();
    if(days.includes(dow)) count++;
  }
  return count;
}

function countPresentInMonth(kidId, academyId, year, month){
  const prefix = `${kidId}__${academyId}__${year}-${pad(month+1)}-`;
  let count = 0;
  Object.keys(attendance).forEach(key=>{
    if(key.startsWith(prefix) && attendance[key] === 'present') count++;
  });
  return count;
}

function getSortedPresentDates(kidId, academyId){
  const prefix = `${kidId}__${academyId}__`;
  const dates = [];
  Object.keys(attendance).forEach(key=>{
    if(key.startsWith(prefix) && attendance[key] === 'present'){
      dates.push(key.slice(prefix.length));
    }
  });
  dates.sort();
  return dates;
}

// 특정 날짜(dateStr)의 출석이 전체 누적 중 몇 회차-몇번째인지 라벨을 만든다.
// 회차 이월(예: 상담) 등 사이클 기준(ac.cycleSize)이 설정된 학원에만 적용된다.
// ac.priorCount: 이 앱으로 기록하기 전에 이미 진행한 횟수(수동 입력값)
function getCycleLabel(ac, sortedDates, dateStr){
  if(!ac.cycleSize) return null;
  const idx = sortedDates.indexOf(dateStr);
  if(idx === -1) return null;
  const cum = idx + 1 + (ac.priorCount || 0);
  const cycleNum = Math.ceil(cum / ac.cycleSize);
  const pos = cum - (cycleNum - 1) * ac.cycleSize;
  let label = `${cycleNum}회차-${pos}번째`;
  if(ac.paidCycles){ label += `(${ac.paidCycles}회차납부)`; }
  return label;
}

// 학원 카드/요약에 쓰는 '현재까지 진행 상황' 텍스트
function getCycleStatus(ac, sortedDates){
  if(!ac.cycleSize) return null;
  const cum = sortedDates.length + (ac.priorCount || 0);
  if(cum === 0){
    return { text: `아직 출석 없음 (${ac.cycleSize}회 기준)`, paidText: ac.paidCycles ? `${ac.paidCycles}회차까지 납부` : null };
  }
  const cycleNum = Math.ceil(cum / ac.cycleSize);
  const pos = cum - (cycleNum - 1) * ac.cycleSize;
  return { text: `${cycleNum}회차-${pos}번째 진행중 (누적 ${cum}회)`, paidText: ac.paidCycles ? `${ac.paidCycles}회차까지 납부` : null };
}

function renderMonthLabel(){
  document.getElementById('monthLabel').textContent = `${current.getFullYear()}년 ${current.getMonth()+1}월`;
  document.getElementById('summaryTitle').textContent = `${current.getMonth()+1}월 학원별 현황`;
}

function renderSummary(){
  const grid = document.getElementById('summaryGrid');
  const year = current.getFullYear(), month = current.getMonth();
  const items = [];
  kids.forEach(kid=>{
    (kid.academies||[]).forEach(ac=>{
      const scheduled = countScheduledInMonth(ac.days, year, month);
      const present = countPresentInMonth(kid.id, ac.id, year, month);
      const sortedDates = getSortedPresentDates(kid.id, ac.id);
      const cycleStatus = getCycleStatus(ac, sortedDates);
      items.push({ kid, ac, scheduled, present, cycleStatus });
    });
  });
  if(items.length === 0){
    grid.innerHTML = `<div class="summary-empty">아직 등록된 학원이 없어요. 왼쪽에서 아이와 학원을 추가해보세요.</div>`;
    return;
  }
  grid.innerHTML = items.map(it=>`
    <div class="summary-item">
      <div class="who">
        <span class="avatar-sm" style="background:${it.kid.color}">${escapeHtml(it.kid.name.slice(0,1))}</span>
        ${escapeHtml(it.kid.name)}
      </div>
      <div class="academy-name">${escapeHtml(it.ac.name)}</div>
      <div class="days-row">${daysLabel(it.ac.days) || '요일 미설정'}</div>
      <div class="stat-row">
        <span class="stat-scheduled">이번달 <b>${it.scheduled}</b>회 예정</span>
        <span class="stat-present">출석 <b>${it.present}</b>회</span>
      </div>
      ${it.cycleStatus ? `
        <div class="cycle-row">${escapeHtml(it.cycleStatus.text)}</div>
        ${it.cycleStatus.paidText ? `<div class="cycle-paid-row">${escapeHtml(it.cycleStatus.paidText)}</div>` : ''}
      ` : ''}
      ${it.ac.note ? `<div class="summary-note">📌 ${escapeHtml(it.ac.note)}</div>` : ''}
    </div>
  `).join('');
}

function renderKidList(){
  const list = document.getElementById('kidList');
  if(kids.length === 0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);padding:6px 0 2px;">등록된 아이가 없어요</div>`;
    return;
  }
  list.innerHTML = kids.map(kid=>{
    const academies = kid.academies || [];
    const academyHtml = academies.map(ac=>{
      const cycleText = ac.cycleSize ? ` · ${ac.cycleSize}회 1주기${ac.paidCycles ? ` · ${ac.paidCycles}회차까지 납부` : ''}${ac.priorCount ? ` · 기존 ${ac.priorCount}회 반영` : ''}` : '';
      return `
      <div class="academy-tag">
        <div class="academy-tag-main">
          <span><span class="a-name">${escapeHtml(ac.name)}</span><span class="a-days">${daysLabel(ac.days) || '요일 미설정'}${escapeHtml(cycleText)}</span></span>
          <span class="a-actions">
            <button class="a-edit" data-kid="${kid.id}" data-academy="${ac.id}" title="수정">✎</button>
            <button class="a-del" data-kid="${kid.id}" data-academy="${ac.id}" title="삭제">×</button>
          </span>
        </div>
        ${ac.note ? `<div class="a-note">📌 ${escapeHtml(ac.note)}</div>` : ''}
      </div>
    `;
    }).join('');

    const formOpenForAdd = academyFormState && academyFormState.kidId === kid.id && !academyFormState.academyId;
    const editingAcademy = academyFormState && academyFormState.kidId === kid.id && academyFormState.academyId
      ? academies.find(a=>a.id === academyFormState.academyId) : null;
    const formOpen = !!(formOpenForAdd || editingAcademy);
    const prefillName = editingAcademy ? editingAcademy.name : '';
    const prefillDays = editingAcademy ? editingAcademy.days : [];
    const prefillCycleSize = editingAcademy && editingAcademy.cycleSize ? editingAcademy.cycleSize : '';
    const prefillPaidCycles = editingAcademy && editingAcademy.paidCycles ? editingAcademy.paidCycles : '';
    const prefillPriorCount = editingAcademy && editingAcademy.priorCount ? editingAcademy.priorCount : '';
    const prefillNote = editingAcademy && editingAcademy.note ? editingAcademy.note : '';

    return `
      <div class="kid-block">
        <div class="kid-head">
          <div class="avatar" style="background:${kid.color}">${escapeHtml(kid.name.slice(0,1))}</div>
          <div class="kid-name">${escapeHtml(kid.name)}</div>
          <button class="kid-del" data-id="${kid.id}" title="아이 삭제">×</button>
        </div>
        <div class="academy-list">${academyHtml}</div>
        <button class="mini-add-btn" data-kid="${kid.id}">+ 학원 추가</button>
        <div class="academy-form ${formOpen ? 'open' : ''}" data-form-for="${kid.id}">
          <input type="text" class="academy-name-input" placeholder="학원 이름 (예: 피아노)" data-kid="${kid.id}" value="${escapeHtml(prefillName)}">
          <div class="day-toggle-row" data-kid="${kid.id}">
            ${FORM_DAY_ORDER.map(d=>`<button type="button" class="day-toggle${prefillDays.includes(d) ? ' on' : ''}" data-day="${d}">${DAY_LABELS[d]}</button>`).join('')}
          </div>
          <div class="cycle-input-row">
            <input type="number" min="1" class="academy-cycle-input" placeholder="몇 회당 1주기 (선택, 예: 12)" value="${prefillCycleSize}">
            <input type="number" min="1" class="academy-paid-input" placeholder="납부 완료 회차 (선택, 예: 6)" value="${prefillPaidCycles}">
            <input type="number" min="0" class="academy-prior-input" placeholder="이 앱 기록 전 이미 진행한 횟수 (선택, 예: 8)" value="${prefillPriorCount}">
            <input type="text" class="academy-note-input" placeholder="메모 (선택, 예: 결제취소 이월 2회)" value="${escapeHtml(prefillNote)}">
          </div>
          <div class="form-row">
            <button class="btn btn-primary academy-save-btn" data-kid="${kid.id}" data-academy="${editingAcademy ? editingAcademy.id : ''}">${editingAcademy ? '수정 저장' : '저장'}</button>
            <button class="btn btn-muted academy-cancel-btn">취소</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.kid-del').forEach(btn=> btn.addEventListener('click', ()=> deleteKid(btn.dataset.id)));
  list.querySelectorAll('.a-del').forEach(btn=> btn.addEventListener('click', ()=> deleteAcademy(btn.dataset.kid, btn.dataset.academy)));
  list.querySelectorAll('.a-edit').forEach(btn=> btn.addEventListener('click', ()=>{
    const kidId = btn.dataset.kid, academyId = btn.dataset.academy;
    const already = academyFormState && academyFormState.kidId === kidId && academyFormState.academyId === academyId;
    academyFormState = already ? null : { kidId, academyId };
    renderKidList();
  }));
  list.querySelectorAll('.mini-add-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    const kidId = btn.dataset.kid;
    const already = academyFormState && academyFormState.kidId === kidId && !academyFormState.academyId;
    academyFormState = already ? null : { kidId, academyId: null };
    renderKidList();
  }));
  list.querySelectorAll('.academy-cancel-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    academyFormState = null;
    renderKidList();
  }));
  list.querySelectorAll('.day-toggle').forEach(btn=> btn.addEventListener('click', ()=>{
    btn.classList.toggle('on');
  }));
  list.querySelectorAll('.academy-save-btn').forEach(btn=> btn.addEventListener('click', async ()=>{
    const kidId = btn.dataset.kid;
    const academyId = btn.dataset.academy || null;
    const form = document.querySelector(`.academy-form[data-form-for="${kidId}"]`);
    const name = form.querySelector('.academy-name-input').value.trim();
    const selectedDays = Array.from(form.querySelectorAll('.day-toggle.on')).map(b=>parseInt(b.dataset.day,10));
    const cycleSizeRaw = form.querySelector('.academy-cycle-input').value.trim();
    const paidCyclesRaw = form.querySelector('.academy-paid-input').value.trim();
    const priorCountRaw = form.querySelector('.academy-prior-input').value.trim();
    const note = form.querySelector('.academy-note-input').value.trim();
    const cycleSize = cycleSizeRaw ? parseInt(cycleSizeRaw, 10) : null;
    const paidCycles = paidCyclesRaw ? parseInt(paidCyclesRaw, 10) : null;
    const priorCount = priorCountRaw ? parseInt(priorCountRaw, 10) : 0;
    if(!name || selectedDays.length === 0) return;
    const kid = kids.find(k=>k.id===kidId);
    if(!kid.academies) kid.academies = [];
    if(academyId){
      const ac = kid.academies.find(a=>a.id===academyId);
      if(ac){ ac.name = name; ac.days = selectedDays; ac.cycleSize = cycleSize; ac.paidCycles = paidCycles; ac.priorCount = priorCount; ac.note = note; }
    } else {
      kid.academies.push({ id:'ac_'+Date.now(), name, days:selectedDays, cycleSize, paidCycles, priorCount, note });
    }
    academyFormState = null;
    await saveKids();
    render();
  }));
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const year = current.getFullYear();
  const month = current.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = (firstDay.getDay() + 6) % 7; // Monday-start
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // 회차 계산용: 학원별 출석일을 미리 한번만 정렬해둔다.
  const sortedDatesCache = {};
  kids.forEach(kid=>{
    (kid.academies||[]).forEach(ac=>{
      sortedDatesCache[`${kid.id}__${ac.id}`] = getSortedPresentDates(kid.id, ac.id);
    });
  });

  for(let i=0;i<startOffset;i++){
    const cell = document.createElement('div');
    cell.className = 'cell empty';
    grid.appendChild(cell);
  }

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const dow = d.getDay();
    const key = dateKey(d);

    // gather scheduled (kid, academy) pairs for this weekday
    const scheduled = [];
    kids.forEach(kid=>{
      (kid.academies||[]).forEach(ac=>{
        if(ac.days.includes(dow)) scheduled.push({ kid, ac });
      });
    });

    const isSunday = dow === 0;
    const holidayName = KR_HOLIDAYS[key] || null;
    const isHoliday = isSunday || !!holidayName;

    const cell = document.createElement('div');
    cell.className = 'cell' + (scheduled.length ? ' has-class' : '') + (isHoliday ? ' holiday' : '');
    const num = document.createElement('div');
    num.className = 'date-num';
    num.textContent = day;
    cell.appendChild(num);

    if(holidayName){
      const label = document.createElement('div');
      label.className = 'holiday-name';
      label.textContent = holidayName;
      label.title = holidayName;
      cell.appendChild(label);
    }

    if(scheduled.length){
      const chipList = document.createElement('div');
      chipList.className = 'chip-list';
      scheduled.forEach(({kid, ac})=>{
        const attKey = `${kid.id}__${ac.id}__${key}`;
        const status = attendance[attKey];
        const chip = document.createElement('div');
        chip.className = 'chip' + (status ? ' '+status : '');
        chip.style.borderLeft = `4px solid ${kid.color}`;
        chip.innerHTML = `<span class="dot" style="background:${kid.color}"></span><span class="txt">${escapeHtml(ac.name)}</span>`;
        chip.title = `${kid.name} · ${ac.name}`;
        chip.addEventListener('click', ()=> cycleAttendance(attKey));
        chipList.appendChild(chip);

        if(status === 'present' && ac.cycleSize){
          const sortedDates = sortedDatesCache[`${kid.id}__${ac.id}`] || [];
          const cycleLabelText = getCycleLabel(ac, sortedDates, key);
          if(cycleLabelText){
            const cycleEl = document.createElement('div');
            cycleEl.className = 'chip-cycle-label';
            cycleEl.textContent = cycleLabelText;
            cycleEl.title = cycleLabelText;
            chipList.appendChild(cycleEl);
          }
        }
      });
      cell.appendChild(chipList);
    }
    grid.appendChild(cell);
  }
}

async function cycleAttendance(key){
  const cur = attendance[key];
  if(!cur) attendance[key] = 'present';
  else if(cur === 'present') attendance[key] = 'absent';
  else delete attendance[key];
  await saveAttendance();
  render();
}

async function deleteKid(id){
  kids = kids.filter(k => k.id !== id);
  Object.keys(attendance).forEach(key=>{ if(key.startsWith(id+'__')) delete attendance[key]; });
  await saveKids();
  await saveAttendance();
  render();
}

async function deleteAcademy(kidId, academyId){
  const kid = kids.find(k=>k.id===kidId);
  if(!kid) return;
  kid.academies = (kid.academies||[]).filter(a=>a.id!==academyId);
  Object.keys(attendance).forEach(key=>{ if(key.startsWith(`${kidId}__${academyId}__`)) delete attendance[key]; });
  await saveKids();
  await saveAttendance();
  render();
}

function renderKidLegend(){
  const el = document.getElementById('kidLegend');
  if(kids.length < 2){ el.innerHTML = ''; return; } // 아이가 1명이면 색 구분이 필요 없음
  el.innerHTML = kids.map(kid=>`
    <span class="item"><span class="dot" style="background:${kid.color}"></span>${escapeHtml(kid.name)}</span>
  `).join('');
}

function render(){
  renderMonthLabel();
  renderSummary();
  renderKidList();
  renderKidLegend();
  renderGrid();
}

document.getElementById('prevBtn').addEventListener('click', ()=>{ current.setMonth(current.getMonth()-1); render(); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ current.setMonth(current.getMonth()+1); render(); });

const addKidForm = document.getElementById('addKidForm');
document.getElementById('showAddKidBtn').addEventListener('click', ()=>{
  addKidForm.classList.add('open');
  document.getElementById('nameInput').focus();
});
document.getElementById('cancelKidBtn').addEventListener('click', ()=>{
  addKidForm.classList.remove('open');
  document.getElementById('nameInput').value='';
});
document.getElementById('saveKidBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return;
  const color = AVATAR_COLORS[kids.length % AVATAR_COLORS.length];
  kids.push({ id:'kid_'+Date.now(), name, color, academies:[] });
  await saveKids();
  document.getElementById('nameInput').value='';
  addKidForm.classList.remove('open');
  render();
});
